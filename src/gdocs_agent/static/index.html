<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Doc chat</title>
  <link rel="stylesheet" href="/overlay.css">
  <style>
    :root {
      --bug: 48px;
      --pad: 10px;
      --gap: 8px;
      --bar-w: 312px;
      --bar-h: 52px;
      --updates-h: 150px;
      --notice: 44px;
      --menu-w: 180px;
      --menu-h: 84px;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fffdf8;
      color: #1d1a16;
      font-family: "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.35;
      user-select: none;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.55; cursor: default; }

    #bug, #panel, #menu { position: absolute; }
    body[data-anchor="right"] #bug { right: var(--pad); left: auto; }
    body[data-anchor="left"] #bug { left: var(--pad); right: auto; }
    body[data-vertical="bottom"] #bug,
    body[data-vertical="bottom"] #panel,
    body[data-vertical="bottom"] #menu { bottom: var(--pad); top: auto; }
    body[data-vertical="top"] #bug,
    body[data-vertical="top"] #panel,
    body[data-vertical="top"] #menu { top: var(--pad); bottom: auto; }
    body[data-anchor="right"] #panel,
    body[data-anchor="right"] #menu {
      right: calc(var(--pad) + var(--bug) + var(--gap));
      left: auto;
    }
    body[data-anchor="left"] #panel,
    body[data-anchor="left"] #menu {
      left: calc(var(--pad) + var(--bug) + var(--gap));
      right: auto;
    }

    #bug {
      width: var(--bug);
      height: var(--bug);
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #8d3b2f;
      color: #fffaf6;
      display: grid;
      place-items: center;
      cursor: grab;
      box-shadow: inset 0 0 0 1px rgba(255, 250, 246, 0.28);
    }
    #bug:active { cursor: grabbing; }
    #bug svg { display: block; }

    #panel, #menu {
      display: none;
      box-sizing: border-box;
      background: rgba(255, 253, 248, 0.98);
      border: 1px solid rgba(29, 26, 22, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }
    #panel {
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
      padding: 8px;
      border-radius: 16px;
      overflow: hidden;
    }
    #menu {
      flex-direction: column;
      gap: 4px;
      padding: 6px;
      border-radius: 14px;
    }
    body[data-mode="bar"] #panel,
    body[data-mode="updates"] #panel { display: flex; }
    body[data-mode="bar"] #panel { width: var(--bar-w); height: var(--bar-h); }
    body[data-notice="on"][data-mode="bar"] #panel {
      height: calc(var(--bar-h) + var(--notice));
    }
    body[data-mode="updates"] #panel { width: var(--bar-w); height: var(--updates-h); }
    body[data-notice="on"][data-mode="updates"] #panel {
      height: calc(var(--updates-h) + var(--notice));
    }
    body[data-mode="menu"] #menu { display: flex; width: var(--menu-w); height: var(--menu-h); }

    #auth { display: none; align-items: center; gap: 8px; min-height: 36px; }
    body[data-notice="on"] #auth { display: flex; }
    #auth p { margin: 0; flex: 1; color: #6f675c; font-size: 12px; }
    #connect {
      border: 0;
      background: #8d3b2f;
      color: #fffaf6;
      border-radius: 999px;
      height: 28px;
      padding: 0 10px;
      flex: none;
    }

    #updates {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      gap: 4px;
    }
    body[data-mode="updates"] #updates { display: flex; }
    #status, #error, #reply { margin: 0; }
    #status {
      color: #6f675c;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #status:empty { display: none; }
    #reply {
      flex: 1;
      min-height: 0;
      overflow: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      user-select: text;
      cursor: text;
    }
    #reply:empty { display: none; }
    #error { color: #8d3b2f; }
    #error:empty { display: none; }
    #reply a { color: #8d3b2f; }

    #composer { display: flex; gap: 6px; align-items: center; height: 36px; }
    #close {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #6f675c;
      flex: none;
    }
    #close:hover, #menu button:hover { background: #f3ecdf; }
    #message {
      flex: 1;
      min-width: 0;
      height: 36px;
      border: 0;
      border-radius: 999px;
      background: #f3ecdf;
      padding: 0 12px;
    }
    #message:focus { outline: 2px solid rgba(141, 59, 47, 0.35); outline-offset: 0; }
    #send {
      height: 32px;
      border: 0;
      border-radius: 999px;
      background: #8d3b2f;
      color: #fffaf6;
      padding: 0 12px;
      flex: none;
    }
    #menu button {
      border: 0;
      background: transparent;
      text-align: left;
      border-radius: 8px;
      padding: 8px 10px;
    }
  </style>
</head>
<body data-mode="bug" data-anchor="right" data-vertical="bottom" data-notice="off">
  <section id="panel" aria-label="Doc chat">
    <div id="auth">
      <p id="auth-text">Connect Google Docs before the first edit.</p>
      <button type="button" id="connect">Connect</button>
    </div>
    <div id="updates">
      <p id="status"></p>
      <div id="reply"></div>
      <p id="error"></p>
    </div>
    <form id="composer">
      <button type="button" id="close" aria-label="Hide chat">×</button>
      <input id="message" type="text" placeholder="Ask for an edit" aria-label="Message" autocomplete="off">
      <button type="submit" id="send">Send</button>
    </form>
  </section>
  <button type="button" id="bug" aria-label="Doc chat" aria-expanded="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M7 3.5h7l4 4V20a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 20V5A1.5 1.5 0 0 1 7 3.5z" stroke="currentColor" stroke-width="1.6"/>
      <path d="M14 3.5V8h4.5" stroke="currentColor" stroke-width="1.6"/>
      <path d="M8.5 12.5h7M8.5 16h4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
  <div id="menu" role="menu">
    <button type="button" id="reset" role="menuitem">Reset position</button>
    <button type="button" id="quit" role="menuitem">Quit</button>
  </div>
  <script>
    const bug = document.querySelector("#bug");
    const message = document.querySelector("#message");
    const send = document.querySelector("#send");
    const form = document.querySelector("#composer");
    const statusLine = document.querySelector("#status");
    const reply = document.querySelector("#reply");
    const errorLine = document.querySelector("#error");
    const authText = document.querySelector("#auth-text");
    const connect = document.querySelector("#connect");

    const labels = {
      list_documents: "Looking through your docs",
      create_document: "Creating a document",
      read_document: "Reading the document",
      insert_text: "Inserting text",
      replace_text: "Replacing text",
      delete_text: "Deleting text",
      format_text: "Updating text style",
      format_paragraph: "Updating paragraph style"
    };

    let bugX = null;
    let bugY = null;
    let mode = "bug";
    let connected = true;
    let pointerInside = false;
    let sending = false;
    let fieldFocused = false;
    let dragging = false;
    let sessionId = null;
    let assistant = null;
    let collapseTimer = null;
    let queued = null;
    let pumping = false;

    function api() {
      return window.pywebview && window.pywebview.api;
    }

    function requestLayout(nextMode, x, y) {
      mode = nextMode;
      const showNotice = !connected && (nextMode === "bar" || nextMode === "updates");
      queued = { mode: nextMode, x, y, notice: showNotice };
      if (!pumping) pump();
    }

    async function pump() {
      pumping = true;
      try {
        while (queued) {
          const current = queued;
          queued = null;
          const bridge = api();
          if (!bridge) return;
          try {
            const layout = await bridge.layout(current.x, current.y, current.mode, current.notice);
            bugX = layout.bugX;
            bugY = layout.bugY;
            if (!queued) apply(layout, current.mode);
          } catch {
          }
        }
      } finally {
        pumping = false;
        if (queued) pump();
      }
    }

    function apply(layout, nextMode) {
      mode = nextMode;
      document.body.dataset.mode = nextMode;
      document.body.dataset.anchor = layout.anchor;
      document.body.dataset.vertical = layout.vertical;
      document.body.dataset.notice = connected ? "off" : "on";
      bug.setAttribute("aria-expanded", nextMode === "bug" ? "false" : "true");
    }

    function scheduleCollapse(delay) {
      clearTimeout(collapseTimer);
      collapseTimer = setTimeout(async () => {
        if (dragging || sending || fieldFocused || mode === "bug" || bugX === null) return;
        const bridge = api();
        if (pointerInside) return;
        if (bridge && await bridge.pointer_over()) {
          pointerInside = true;
          return;
        }
        if (dragging || sending || fieldFocused || pointerInside || mode === "bug") return;
        requestLayout("bug", bugX, bugY);
      }, delay);
    }

    document.documentElement.addEventListener("pointerenter", () => {
      pointerInside = true;
      clearTimeout(collapseTimer);
      if (dragging || sending || fieldFocused || bugX === null) return;
      if (mode === "bug") requestLayout("bar", bugX, bugY);
    });

    document.documentElement.addEventListener("pointerleave", () => {
      pointerInside = false;
      if (dragging) return;
      scheduleCollapse(sending ? 1600 : 240);
    });

    bug.addEventListener("pointerdown", (event) => {
      if (event.button !== 0 || bugX === null) return;
      event.preventDefault();
      dragging = true;
      const originX = bugX;
      const originY = bugY;
      const startX = event.screenX;
      const startY = event.screenY;
      bug.setPointerCapture(event.pointerId);

      function move(ev) {
        requestLayout(mode, originX + (ev.screenX - startX), originY + (ev.screenY - startY));
      }
      function up(ev) {
        dragging = false;
        bug.removeEventListener("pointermove", move);
        bug.removeEventListener("pointerup", up);
        const bridge = api();
        if (bridge) {
          bridge.save_position(originX + (ev.screenX - startX), originY + (ev.screenY - startY)).then((saved) => {
            bugX = saved.bugX;
            bugY = saved.bugY;
          });
        }
        if (!pointerInside) scheduleCollapse(240);
      }
      bug.addEventListener("pointermove", move);
      bug.addEventListener("pointerup", up);
    });

    bug.addEventListener("contextmenu", (event) => {
      event.preventDefault();
      if (bugX === null) return;
      requestLayout("menu", bugX, bugY);
    });

    document.querySelector("#close").addEventListener("click", () => {
      if (bugX === null) return;
      requestLayout("bug", bugX, bugY);
    });
    document.querySelector("#reset").addEventListener("click", async () => {
      const bridge = api();
      if (!bridge) return;
      const layout = await bridge.reset_position();
      bugX = layout.bugX;
      bugY = layout.bugY;
      apply(layout, "bug");
    });
    document.querySelector("#quit").addEventListener("click", () => {
      const bridge = api();
      if (bridge) bridge.quit();
    });

    message.addEventListener("pointerdown", async (event) => {
      if (event.button !== 0) return;
      event.preventDefault();
      const bridge = api();
      if (bridge) await bridge.activate();
      fieldFocused = true;
      message.focus();
    });
    message.addEventListener("focus", () => {
      fieldFocused = true;
      clearTimeout(collapseTimer);
    });
    message.addEventListener("blur", () => {
      fieldFocused = false;
      setTimeout(() => {
        if (!fieldFocused && api()) api().deactivate();
      }, 180);
      scheduleCollapse(240);
    });
    message.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        form.requestSubmit();
      }
    });
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(message.value);
    });

    function linkify(node, text) {
      node.replaceChildren();
      const pattern = /https:\/\/docs\.google\.com\/document\/d\/[a-zA-Z0-9-_]+[^\s)]*/g;
      let cursor = 0;
      for (const match of text.matchAll(pattern)) {
        node.append(text.slice(cursor, match.index));
        const link = document.createElement("a");
        link.href = match[0];
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Open document";
        node.append(link);
        cursor = match.index + match[0].length;
      }
      node.append(text.slice(cursor));
    }

    function clearTurn() {
      assistant = { text: "" };
      statusLine.textContent = "Working…";
      reply.replaceChildren();
      errorLine.textContent = "";
    }

    function appendText(chunk) {
      if (!assistant) assistant = { text: "" };
      assistant.text += chunk;
      reply.textContent = assistant.text;
      reply.scrollTop = reply.scrollHeight;
    }

    function finishText() {
      if (assistant && assistant.text) linkify(reply, assistant.text);
    }

    function toolLine(name, toolStatus, summary) {
      finishText();
      const label = labels[name] || name;
      statusLine.textContent = toolStatus === "running"
        ? label + "…"
        : label + (summary ? " — " + summary : "");
    }

    function showError(text) {
      errorLine.textContent = text;
      statusLine.textContent = "";
    }

    function handleEvent(raw) {
      let eventName = "message";
      const dataLines = [];
      for (const line of raw.split("\n")) {
        if (line.startsWith("event:")) eventName = line.slice(6).trim();
        else if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
      }
      if (!dataLines.length) return;
      const data = JSON.parse(dataLines.join("\n"));
      if (eventName === "session") sessionId = data.session_id;
      else if (eventName === "text") appendText(data.text || "");
      else if (eventName === "tool") toolLine(data.name, data.status, data.summary || "");
      else if (eventName === "error") showError(data.message || "Something went wrong.");
    }

    async function sendMessage(text) {
      const value = text.trim();
      if (!value || sending || bugX === null) return;
      message.value = "";
      sending = true;
      send.disabled = true;
      message.disabled = true;
      clearTurn();
      requestLayout("updates", bugX, bugY);
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: value, session_id: sessionId })
        });
        if (!response.ok || !response.body) {
          const failure = await response.json().catch(() => ({}));
          showError(failure.detail || "The chat request failed.");
          return;
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const step = await reader.read();
          if (step.done) break;
          buffer += decoder.decode(step.value, { stream: true });
          let splitAt = buffer.indexOf("\n\n");
          while (splitAt >= 0) {
            handleEvent(buffer.slice(0, splitAt));
            buffer = buffer.slice(splitAt + 2);
            splitAt = buffer.indexOf("\n\n");
          }
        }
        finishText();
      } catch (error) {
        showError(error.message || "The connection dropped.");
      } finally {
        sending = false;
        send.disabled = false;
        message.disabled = false;
        if (statusLine.textContent === "Working…") statusLine.textContent = "";
        if (!pointerInside && !fieldFocused) scheduleCollapse(1600);
      }
    }

    async function refreshAuth() {
      const response = await fetch("/api/auth/status");
      const status = await response.json();
      connected = Boolean(status.connected);
      document.body.dataset.notice = connected ? "off" : "on";
      authText.textContent = (!connected && status.detail) || "Connect Google Docs before the first edit.";
      if (mode !== "bug" && bugX !== null) requestLayout(mode, bugX, bugY);
    }

    connect.addEventListener("click", async () => {
      connect.disabled = true;
      authText.textContent = "Approve the Google prompt in your browser.";
      try {
        const response = await fetch("/api/auth/login", { method: "POST" });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          authText.textContent = payload.detail || "Google sign-in failed.";
          return;
        }
        await refreshAuth();
      } catch (error) {
        authText.textContent = error.message || "Google sign-in failed.";
      } finally {
        connect.disabled = false;
      }
    });

    async function init() {
      const bridge = api();
      if (!bridge) return;
      const state = await bridge.get_state();
      bugX = state.bugX;
      bugY = state.bugY;
      await refreshAuth();
      requestLayout("bug", bugX, bugY);
    }

    if (api()) init();
    else window.addEventListener("pywebviewready", init);
  </script>
</body>
</html>
