[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdocs-agent"
version = "0.1.0"
description = "Chat with Claude to edit Google Docs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-api-python-client>=2.140.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.0",
  "anthropic>=0.49.0",
  "mcp>=1.2.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-dotenv>=1.0.0",
  "pywebview>=5.1",
]

[project.scripts]
gdocs-chat = "gdocs_agent.api:main"
gdocs-mcp = "gdocs_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gdocs_agent = ["static/*"]
